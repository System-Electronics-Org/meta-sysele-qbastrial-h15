# We have a conf directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "sysele-qba-bsp"
BBFILE_PATTERN_sysele-qba-bsp = "^${LAYERDIR}/"
# One above meta-sysele-bsp (10), so that our bbappends are applied after its own.
BBFILE_PRIORITY_sysele-qba-bsp = "11"

# This layer only holds the difference from meta-sysele-astrial-h15, whose collection is meta-sysele-bsp.
LAYERDEPENDS_sysele-qba-bsp = "meta-sysele-bsp"
LAYERSERIES_COMPAT_sysele-qba-bsp = "kirkstone"

LAYERVERSION_sysele-qba-bsp = "1"

# Serial console of the image (getty).
SERIAL_CONSOLES:astrial-h15 = "115200;ttyS0"

# No display: the Waveshare trees and overlays leave the FIT and the boot menu.
KERNEL_DEVICETREE:astrial-h15 = "sysele/astrial-h15.dtb"

# SCU bootloader fallback: target slot, other slot, target slot again; two boots that end in a watchdog reset each.
SYSELE_SCU_FALLBACK_OFFSET = "0x00078000"
SYSELE_SCU_BOOT_RETRIES = "0x02"
SYSELE_SCU_LAST_VALID_DESC = "2"

# Hailo's runtime package groups only; see recipes-core/images/core-image-hailo-dev.bbappend.
DISTRO_FEATURES:remove = "hailo-dev-pkg"

# Python 3 and numpy in the image (switches of packagegroup-hailo-linux-python).
ADD_PYTHON_TO_IMAGE = "true"
ADD_PYTHON_NUMPY_TO_IMAGE = "true"
